schema_version: 1
extends: base.yaml

exp_name: "20261121_003"
scripts: "VLM token with FM token, strict two stream tactile inject, VLM -> VLM token -> A5-A49, VLM -> FM token -> A0-A4"

policy:
  streaming: true
  streaming_attention_mode: random_gate
  n_obs_steps: 21
  observation_delay_max_tokens: 20
  use_observation_delay_adaln_zero: true
  use_tactile: true
  use_vlm_tactile_token: true
  use_fm_tactile_token: true
  vlm_tactile_token_history_length: 20
  fm_tactile_token_history_length: 5
  use_modality_count_bias: true
  use_tactile_ca0: false
  use_tactile_cross_attention: true
  vlm_context_reads_tactile: false
  fm_tactile_reads_vlm_tactile: false