# Task-level UniVTAC/Panda settings shared by dated experiments.
schema_version: 1
extends: ../../default.yaml
repo_id: univtac/lift_can

dataset:
  root: /root/datasets/lerobot/univtac/lift_can_v30
  video_backend: pyav
  image_color_order: bgr

policy:
  path: lerobot/smolvla_base
  state_dim: 9
  action_dim: 9
  adapt_pretrained_dimensions: true
  freeze_vision_encoder: false
  train_expert_only: false
  device: cuda
  push_to_hub: false
  use_noise_adarms: true
  use_noise_embedding: false
  tactile_normalization: image_size

rename_map:
  observation.images.head: observation.images.camera1
  observation.images.wrist: observation.images.camera2

batch_size: 8
num_workers: 16
steps: 8000
log_freq: 100
save_freq: 8000

accelerator:
  mixed_precision: bf16
  gradient_accumulation:
    steps: 4
    sync_each_batch: false

ema:
  type: constant
  update_after_step: 0
  decay: 0.99
