# Shared training-pipeline defaults for layered YAML experiments.
# A task base must provide repo_id and select/configure a policy.
schema_version: 1
repo_id: null
exp_name: null
scripts: ''
output_base_dir: outputs/train

dataset:
  repo_type: dataset
  root: null
  episodes: null
  exclude_episodes: null
  # Channel semantics AFTER decoding, not the camera format before video encoding.
  # bgr swaps red/blue before augmentation; correctly encoded videos normally use rgb.
  image_color_order: rgb
  image_transforms:
    enable: false
    backend: dataloader
    gpu_compile: true
    gpu_chunk_size: 32
    max_num_transforms: 3
    random_order: false
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.8, 1.2]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.8, 1.2]
      saturation:
        weight: 1.0
        type: ColorJitter
        kwargs:
          saturation: [0.5, 1.5]
      hue:
        weight: 1.0
        type: ColorJitter
        kwargs:
          hue: [-0.05, 0.05]
      sharpness:
        weight: 1.0
        type: SharpnessJitter
        kwargs:
          sharpness: [0.5, 1.5]
      affine:
        weight: 1.0
        type: RandomAffine
        kwargs:
          degrees: [-5.0, 5.0]
          translate: [0.05, 0.05]
  revision: null
  use_imagenet_stats: true
  video_backend: torchcodec
  return_uint8: false
  depth_output_unit: mm
  streaming: false
  streaming_episode_pool_size: null
  streaming_sampling_strategy: remaining
  streaming_prefetch_episodes: 8
  streaming_byte_budget_gb: 8.0
  streaming_decode_threads: 2
  streaming_decoded_queue_size: 8
  streaming_native_http_connections: null
  streaming_native_http_subranges: 1
  streaming_sidecar_lock_timeout_s: 1800
  video_decoder_cache_size: null
  eval_split: 0.0

env: null
# SmolVLA policy defaults. A task-level base or dated experiment can override
# only the fields it needs; selecting another policy type replaces this mapping.
policy:
  type: smolvla
  path: null
  n_obs_steps: 1
  chunk_size: 50
  streaming: false
  streaming_chunk_size: 5
  streaming_attention_mode: bidirectional
  streaming_constant_weight: 0.2
  streaming_chunk_wise_weight: 0.8
  use_noise_embedding: true
  use_noise_adarms: false
  use_modality_count_bias: false  # FM logits subtract log(visible keys per modality).
  observation_delay_max_chunks: 0
  observation_delay_max_tokens: 0
  use_observation_delay_sincos: false  # Per-action sin/cos(d+i) -> MLP; chunks converted to steps.
  use_observation_delay_embedding: false
  use_observation_delay_adarms: false  # Per-layer RMSNorm scale/shift in the FM expert.
  use_observation_delay_adaln_zero: false  # Pretrained RMSNorm scale/shift with zero residual gates.
  observation_delay_zero_bypass: false  # Zero path: d=0 keeps original norms and residual gate=1.
  use_observation_delay_token: false
  use_tactile: false
  use_tactile_delta: false  # Raw current-baseline displacement; bypass absolute-coordinate normalization.
  use_tactile_finger_tokens: false  # Separate left/right tokens; learned finger IDs 0/1 per branch.
  use_tactile_adarms: false  # AdaLN-Zero: per-layer RMSNorm scale/shift + zero residual gates.
  use_tactile_hmm: false  # Use the K=8 state from dataset meta/hmm.json for tactile AdaLN-Zero.
  use_fm_tactile_token: false
  use_tactile_ca0: true  # Legacy CA0 isolation by default; false routes FM tactile to the first chunk.
  use_vlm_tactile_token: false  # Independent 720-wide tactile MLP/TCN + projector in VLM prefix.
  vlm_tactile_reads_state: false  # Allow VLM tactile queries to read state tokens.
  vlm_state_reads_tactile: false  # Also requires vlm_context_reads_tactile=true.
  vlm_context_reads_tactile: true  # Master permission for non-tactile VLM queries to read tactile.
  fm_tactile_reads_vlm_tactile: true  # Allow FM tactile queries to read VLM tactile K/V.
  use_tactile_cross_attention: false  # CA0 and the tactile block read live FM tactile K/V.
  use_tactile_self_attention: true  # CA0/first-chunk action reads FM tactile in self-attention layers.
  use_tactile_cfg_gate: false
  use_tactile_reconstruction: false  # Frozen encoder/TCN output -> MLP -> current normalized tactile markers.
  tactile_reconstruction_hidden_dim: 256
  tactile_cfg_gate_hidden_dim: 256
  tactile_cfg_lambda_init: 0.5
  tactile_cfg_lambda_max: 2.0
  use_tactile_tcn: false  # True: one full-width TCN summary per 5 frames. False: direct history.
  use_tactile_causal_attention: false  # Direct history block only: causal instead of bidirectional.
  tactile_no_vlm_attention: false  # Tactile queries read only the tactile block, without VLM prefix K/V.
  tactile_token_history_length: 1  # Legacy fallback when a branch length is null.
  fm_tactile_token_history_length: null  # FM history frames, including the current frame.
  vlm_tactile_token_history_length: null  # VLM history frames at prefix refreshes.
  tactile_feature_names:
    - observation.tactile.left_marker
    - observation.tactile.right_marker
reward_model: null

output_dir: null
job_name: null
resume: false
seed: 1000
cudnn_deterministic: false
tf32: true
num_workers: 4
batch_size: 8
prefetch_factor: 4
persistent_workers: true
dataloader_multiprocessing_context: spawn
steps: 100000
env_eval_freq: 20000
log_freq: 200
eval_steps: 0
max_eval_samples: 0
tolerance_s: 0.0001
save_checkpoint: true
save_freq: 20000
checkpoint_format: safetensors
use_policy_training_preset: true
optimizer: null
scheduler: null

parallelism:
  dp_replicate: 1
  dp_shard: 1
  context_parallel:
    ring_degree: 1
    ulysses_degree: 1
  cfg_parallel: 1

accelerator:
  mixed_precision: 'no'
  gradient_accumulation:
    steps: 1
    sync_each_batch: false
  grad_scaler:
    init_scale: 65536.0
    growth_factor: 2.0
    backoff_factor: 0.5
    growth_interval: 2000
  fsdp:
    reshard_after_forward: true
    wrap_modules: null
    min_num_params: null
    cpu_offload: false
    ignored_modules: null
    mixed_precision_policy:
      param_dtype: null
      reduce_dtype: null
      output_dtype: null
      cast_forward_inputs: true
  ddp:
    find_unused_parameters: true
    gradient_as_bucket_view: false
    static_graph: false
  init_process_group:
    backend: nccl
    init_method: null
    timeout: null
  compile:
    enabled: false
    backend: inductor
    mode: null
    regional: true
  activation_checkpointing:
    mode: none

eval:
  n_episodes: 50
  batch_size: 50
  use_async_envs: true
  recording: false
  recording_repo_id: null
  recording_private: false
  max_episode_steps: null

ema: null
trackio:
  enable: false
  disable_artifact: true
  project: lerobot
  space_id: null
  private: null
  run_name: null
  resume: null
  capture_console: true
peft: null
job:
  target: null
  image: huggingface/lerobot-gpu:latest
  timeout: 2d
  detach: false
  tags: []
save_checkpoint_to_hub: false
sample_weighting: null
rename_map: {}
